<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Chococart">
  <rect width="32" height="32" rx="6" fill="#F4EBDD" />
  <!-- The house mark: a cacao pod flanked by leaves. Drawn heavier than the
       header lockup, and dark on cream rather than the other way round — at
       16px a 1.1px stroke disappears, and the pod holds its shape far better
       as the dark form than as the light one. -->
  <g transform="translate(0 0.3)">
    <path
      d="M9.6 15.6c-2.3-.8-4.3-.4-5.7 1 1.3 1.6 3.2 2.3 5.4 2.1M22.4 15.6c2.3-.8 4.3-.4 5.7 1-1.3 1.6-3.2 2.3-5.4 2.1"
      fill="none"
      stroke="#A66A3F"
      stroke-width="2.6"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M16 3.4c-4.4 3.3-6.6 7.4-6.6 12.1 0 5.3 2.6 9.6 6.6 12.6 4-3 6.6-7.3 6.6-12.6 0-4.7-2.2-8.8-6.6-12.1Z"
      fill="#241714"
    />
  </g>
</svg>
